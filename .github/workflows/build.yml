name: Build Airblue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - recipes/**
      - scripts/**
      - files/**
      - tests/**
  push:
    paths:
      - .github/workflows/build.yml
      - recipes/**
      - scripts/**
      - files/**
      - tests/**
  schedule:
    - cron: '0 6 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate source contract
        run: |
          test -f recipes/recipe.yml
          bash tests/test-recipe.sh

      # BlueBuild v1.11 has no image output, and its default Docker driver does
      # not load push:false results on GitHub Actions. The supported Podman
      # driver retains this unprivileged build locally for the exact-image gate.
      - name: Build Airblue without credentials
        uses: blue-build/github-action@v1.11
        with:
          recipe: recipe.yml
          cosign_private_key: ''
          registry_username: ''
          registry_token: ''
          registry_namespace: ${{ github.repository_owner }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          build_opts: --build-driver podman
          push: false
          skip_checkout: true

      - name: Smoke test the image built by this run
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REGISTRY,,}/airblue:${GITHUB_SHA::7}-44"
          podman image exists "$image_ref"
          podman run --pull=never --rm --interactive --entrypoint /usr/bin/bash "$image_ref" -s < tests/test-image.sh

  # Publishing deliberately rebuilds after the unprivileged smoke gate. This
  # lets the standard BlueBuild action own registry publication and signing;
  # the accepted tradeoff is that the published rebuild is not byte-identical.
  publish:
    name: Rebuild, sign, and publish
    needs: validate
    if: >-
      ${{ needs.validate.result == 'success' &&
          github.event_name != 'pull_request' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event_name == 'schedule' ||
           (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and publish Airblue
        uses: blue-build/github-action@v1.11
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ github.repository_owner }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          push: true
